<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAOPCR | Caja</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header class="top"><div class="brand"><i>P</i>PUNTO DE VENTA</div><div class="row"><span class="chip" id="chip"></span><button class="btn sec sm" id="hist">Historial</button><button class="btn sec sm" id="cajaBtn"></button><span id="who" style="opacity:.8"></span><button class="btn sec sm" onclick="logout()">Salir</button></div></header>
<div class="posx"><nav class="rail"><h4>Categorías</h4><div id="cats"></div></nav>
<section class="cat"><input id="q" placeholder="Buscar producto"><div class="grid" id="menu"></div></section>
<aside class="tk-p"><div class="tabs"><button data-t="cart" class="on">Nuevo pedido</button><button data-t="orders">Pedidos activos<span id="cnt">0</span></button></div>
<div class="tb" id="body"></div><div class="tf" id="foot"></div></aside></div><dialog id="dlg"></dialog>
<script src="assets/app.js"></script><script>
const u=guard(['cajero']);$('#who').textContent=u.nombre;
let menu={cats:[],prods:[],impuesto:0},cart=[],cat=0,q='',caja=null,orders=[],prev={},tab='cart',mesa='',tipo='mesa';
const inCart=id=>cart.filter(l=>l.id==id).reduce((a,l)=>a+l.cantidad,0);
function renderMenu(){$('#cats').innerHTML=[{id:0,nombre:'Todos'},...menu.cats].map(c=>`<button class="${c.id==cat?'on':''}" data-c="${c.id}">${esc(c.nombre)}</button>`).join('');
 $('#menu').innerHTML=menu.prods.filter(p=>(!cat||p.categoria_id==cat)&&p.nombre.toLowerCase().includes(q)).map(p=>{const ag=p.disp!==null&&p.disp<=0;
  return `<button class="prod" data-p="${p.id}" ${ag?'disabled':''}><span class="pn">${esc(p.nombre)}</span><span><span class="pp">${money(p.precio)}</span>${ag?'<span class="tag ko">Agotado</span>':p.disp!==null&&p.disp<=5?`<span class="tag wa">Quedan ${p.disp}</span>`:''}</span></button>`}).join('');
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderMenu()});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=menu.prods.find(x=>x.id==b.dataset.p);if(p.disp!==null&&inCart(p.id)>=p.disp)return toast('No hay más existencias de '+p.nombre);
  const l=cart.find(x=>x.id==p.id&&!x.obs);l?l.cantidad++:cart.push({id:p.id,nombre:p.nombre,precio:+p.precio,cantidad:1,obs:''});tab='cart';render()})}
$('#q').oninput=e=>{q=e.target.value.toLowerCase();renderMenu()};
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
function render(){document.querySelectorAll('.tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#cnt').textContent=orders.length;
 const body=$('#body'),foot=$('#foot');
 if(tab==='cart'){const sub=cart.reduce((a,l)=>a+l.precio*l.cantidad,0),imp=Math.round(sub*menu.impuesto*100)/100;
  body.innerHTML=`<div class="row"><div class="grow"><label>Mesa<input id="mesa" value="${esc(mesa)}" placeholder="Ej. 4"></label></div><div class="grow"><label>Servicio<select id="tipo"><option value="mesa">En mesa</option><option value="llevar" ${tipo==='llevar'?'selected':''}>Para llevar</option></select></label></div></div>`
  +(cart.map((l,i)=>`<div class="line"><div>${esc(l.nombre)}<small>${money(l.precio)}${l.obs?' · '+esc(l.obs):''}</small></div><div class="qty"><button class="btn sm sec" data-m="${i}">-</button><b>${l.cantidad}</b><button class="btn sm sec" data-a="${i}">+</button><button class="btn sm sec" data-o="${i}">Nota</button></div></div>`).join('')||'<p class="mut">Selecciona productos del menú.</p>');
  foot.innerHTML=`<div class="sum"><div><span>Subtotal</span><span>${money(sub)}</span></div><div><span>Impuesto</span><span>${money(imp)}</span></div><div class="t"><span>Total</span><span>${money(sub+imp)}</span></div></div><button class="btn full lg" id="send" ${cart.length?'':'disabled'} style="margin-top:10px">Confirmar y enviar a cocina</button>`;
  $('#mesa').oninput=e=>mesa=e.target.value;$('#tipo').onchange=e=>tipo=e.target.value;
  body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const l=cart[b.dataset.m];if(--l.cantidad<1)cart.splice(b.dataset.m,1);render()});
  body.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const l=cart[b.dataset.a],p=menu.prods.find(x=>x.id==l.id);if(p.disp!==null&&inCart(l.id)>=p.disp)return toast('No hay más existencias');l.cantidad++;render()});
  body.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const l=cart[b.dataset.o];formDlg('Observaciones: '+l.nombre,[{k:'o',l:'Ej. sin azúcar, término medio'}],{o:l.obs},async o=>{l.obs=o.o.trim();render()})});
  $('#send').onclick=async()=>{try{const r=await api('pedidos',{mesa,tipo,items:cart.map(l=>({id:l.id,cantidad:l.cantidad,obs:l.obs}))});toast('Pedido N.° '+r.id+' enviado a cocina');cart=[];mesa='';menu=await api('menu');renderMenu();render()}catch(e){toast(e.message)}};
 }else{foot.innerHTML='';
  body.innerHTML=orders.map(p=>`<div class="ord"><div class="row sp"><b>N.° ${p.id} · ${p.tipo==='llevar'?'Para llevar':'Mesa '+esc(p.mesa)}</b><span class="badge ${p.estado}">${E[p.estado]}</span></div>
  <p class="mut" style="margin:6px 0">${p.items.map(i=>i.cantidad+' × '+esc(i.nombre)).join(', ')}</p><div class="row sp"><b>${money(p.total)}</b><span class="row">
  ${p.pagado==0&&p.estado!=='entregado'?`<button class="btn sm sec" data-x="${p.id}">Cancelar</button>`:''}${p.estado==='listo'?`<button class="btn sm bl" data-d="${p.id}">Entregar</button>`:''}${p.pagado==0?`<button class="btn sm" data-pay="${p.id}" data-t="${p.total}">Cobrar</button>`:'<span class="badge ok">Pagado</span>'}</span></div></div>`).join('')||'<p class="mut">No hay pedidos activos.</p>';
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>api('pedidos/'+b.dataset.d+'/estado',{estado:'entregado'}).catch(e=>toast(e.message)));
  body.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>formDlg('Cancelar pedido N.° '+b.dataset.x,[{k:'motivo',l:'Motivo de la cancelación'}],{},async o=>{await api('pedidos/'+b.dataset.x+'/cancelar',o);menu=await api('menu');renderMenu();toast('Pedido cancelado e inventario devuelto')},'Cancelar pedido'));
  body.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>pay(b.dataset.pay,b.dataset.t))}}
function pay(id,t){const d=dlg(`<h3>Cobrar pedido N.° ${id}</h3><div style="font-size:34px;font-weight:800;margin:8px 0">${money(t)}</div><label>Método de pago<select id="met"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select></label><label id="lr">Valor recibido<input id="rec" type="number" value="${Math.ceil(t)}"></label><p class="mut" id="cb"></p><div class="row end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="ok">Confirmar pago</button></div>`);
 const cb=()=>{const ef=$('#met').value==='efectivo';$('#lr').style.display=ef?'':'none';$('#cb').textContent=ef?'Cambio: '+money(Math.max(0,$('#rec').value-t)):''};$('#met').onchange=cb;$('#rec').oninput=cb;cb();
 $('#no',d).onclick=()=>d.close();
 $('#ok',d).onclick=async()=>{try{dlg(receipt((await api('pedidos/'+id+'/pagar',{metodo:$('#met').value,recibido:+$('#rec').value})).comprobante))}catch(e){toast(e.message)}}}
async function loadCaja(){const r=await api('caja');caja=r.caja;$('#chip').textContent=caja?'Caja abierta | base '+money(caja.base_inicial):'Caja cerrada';$('#chip').className='chip '+(caja?'on':'off');$('#cajaBtn').textContent=caja?'Cerrar caja':'Abrir caja';return r}
$('#hist').onclick=async()=>{const d=dlg('<h3>Historial de pedidos</h3><div id="hv"></div><div class="row end" style="margin-top:14px"><button class="btn sec" onclick="$(\'#dlg\').close()">Cerrar</button></div>',true);try{await renderHist($('#hv',d))}catch(e){toast(e.message)}};
$('#cajaBtn').onclick=async()=>{if(!caja)return formDlg('Abrir caja',[{k:'base',l:'Monto base inicial',t:'number'}],{base:0},async o=>{await api('caja/abrir',{base:+o.base});await loadCaja()},'Abrir caja');
 const r=await loadCaja(),res=r.resumen||[];
 formDlg('Cierre y arqueo de caja',[{k:'contado',l:'Efectivo contado en caja',t:'number'}],{},async o=>{const a=(await api('caja/cerrar',{contado:+o.contado})).arqueo;await loadCaja();
  setTimeout(()=>dlg(`<h3>Arqueo de caja</h3><div class="rcp"><div class="ln"><span>Base inicial</span><span>${money(a.base)}</span></div>${a.metodos.map(m=>`<div class="ln"><span>${esc(m.metodo)} (${m.n})</span><span>${money(m.t)}</span></div>`).join('')}<div class="ln"><span>Total ventas</span><span>${money(a.total_ventas)}</span></div><div class="ln"><span>Efectivo esperado</span><span>${money(a.esperado_efectivo)}</span></div><div class="ln"><span>Efectivo contado</span><span>${money(a.contado)}</span></div><div class="ln tt"><span>Diferencia</span><span class="${a.diferencia?'warn':''}">${money(a.diferencia)}</span></div></div><div class="row end"><button class="btn sec" onclick="$('#dlg').close()">Cerrar</button><button class="btn" onclick="print()">Imprimir</button></div>`),60)},'Cerrar caja');
 $('#dlg').insertAdjacentHTML('afterbegin',`<p class="mut">Ventas del turno: ${res.map(m=>esc(m.metodo)+' '+money(m.t)).join(' | ')||'sin ventas'}</p>`)};
(async()=>{menu=await api('menu');renderMenu();render();await loadCaja();setInterval(async()=>{try{menu=await api('menu');renderMenu()}catch(e){}},30000);
 stream(o=>{o.forEach(p=>{if(prev[p.id]&&prev[p.id]!=='listo'&&p.estado==='listo')toast('Pedido N.° '+p.id+' listo para entregar');prev[p.id]=p.estado});orders=o;render()})})();
</script></body></html>
