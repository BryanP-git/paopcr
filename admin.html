<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAOPCR | Administración</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="adm"><aside class="side"><div class="brand"><i>P</i>PAOPCR</div>
<button data-t="reportes">Reportes</button><button data-t="historial">Pedidos</button><button data-t="cajas">Cierres de caja</button><button data-t="productos">Menú y recetas</button><button data-t="insumos">Inventario</button><button data-t="usuarios">Usuarios</button>
<div class="who"><span id="who"></span><br><a href="#" onclick="logout()" style="color:#b6c3d6">Cerrar sesión</a></div></aside>
<main class="main" id="main"></main></div><dialog id="dlg"></dialog>
<script src="assets/app.js"></script><script>
const u=guard([]);$('#who').textContent=u.nombre;
const H=(t,s,a='')=>`<div class="row sp"><div><h1>${t}</h1><p class="mut" style="margin:0">${s}</p></div><div class="row">${a}</div></div>`;
async function reportes(d1,d2){d1=d1||hoy();d2=d2||d1;const r=await api(`admin/reportes&desde=${d1}&hasta=${d2}`),mx=Math.max(1,...r.horas.map(x=>+x.n)),mv=Math.max(1,...r.dias.map(x=>+x.ventas));
 $('#main').innerHTML=H('Reportes','Desempeño del periodo seleccionado',`<input type="date" id="d1" value="${d1}" style="width:160px"><input type="date" id="d2" value="${d2}" style="width:160px"><button class="btn" id="go">Consultar</button>`)
 +`<div class="kpi"><div class="card"><span>Ventas cobradas</span><b>${money(r.hoy.ventas)}</b></div><div class="card"><span>Pedidos pagados</span><b>${r.hoy.pedidos}</b></div><div class="card"><span>Ticket promedio</span><b>${money(r.hoy.ticket)}</b></div><div class="card"><span>Tiempo de preparación</span><b>${r.tiempos.prep??'-'} min</b></div><div class="card"><span>Espera total al cliente</span><b>${r.tiempos.total??'-'} min</b></div><div class="card"><span>Pedidos cancelados</span><b>${r.canceladas}</b></div></div>
 <div class="two"><div class="card"><h3>Productos más vendidos</h3>${r.top.map(t=>`<div class="row sp"><span>${esc(t.nombre)}</span><b>${t.cant} und. | ${money(t.total)}</b></div>`).join('')||'<span class="mut">Sin datos</span>'}</div>
 <div class="card"><h3>Ventas por método de pago</h3>${r.metodos.map(t=>`<div class="row sp"><span>${esc(t.metodo)}</span><b>${money(t.total)}</b></div>`).join('')||'<span class="mut">Sin datos</span>'}</div>
 <div class="card"><h3>Insumos en stock mínimo</h3>${r.alertas.map(a=>`<div class="row sp"><span>${esc(a.nombre)}</span><b class="warn">${+a.stock} ${esc(a.unidad)}</b></div>`).join('')||'<span class="mut">Todo en orden</span>'}</div></div>
 <div class="two"><div class="card"><h3>Pedidos por hora (horas pico)</h3><div class="cols" style="margin-bottom:24px">${r.horas.map(h=>`<div style="height:${h.n/mx*100}%" title="${h.n} pedidos"><small>${h.h}h</small></div>`).join('')||'<span class="mut">Sin datos</span>'}</div></div>
 <div class="card"><h3>Ventas por día</h3>${r.dias.map(s=>`<div><div class="row sp"><span>${s.dia}</span><b>${money(s.ventas)}</b></div><div class="bar" style="width:${s.ventas/mv*100}%"></div></div>`).join('')||'<span class="mut">Sin datos</span>'}</div></div>`;
 $('#go').onclick=()=>reportes($('#d1').value,$('#d2').value).catch(e=>toast(e.message))}
async function historial(){$('#main').innerHTML=H('Pedidos','Consulta, comprobantes y cancelaciones')+'<div id="hv"></div>';await renderHist($('#hv'))}
async function cajas(){const cs=await api('admin/cajas');$('#main').innerHTML=H('Cierres de caja','Últimos 60 turnos')+`<div class="tw"><table><tr><th>N.°</th><th>Cajero</th><th>Apertura</th><th>Cierre</th><th>Base</th><th>Ventas</th><th>Esperado</th><th>Contado</th><th>Diferencia</th></tr>${cs.map(c=>`<tr><td>${c.id}</td><td>${esc(c.cajero)}</td><td>${c.abierta_en}</td><td>${c.cerrada_en||'<span class="badge ok">Abierta</span>'}</td><td>${money(c.base_inicial)}</td><td>${c.total_ventas==null?'-':money(c.total_ventas)}</td><td>${c.esperado==null?'-':money(c.esperado)}</td><td>${c.contado==null?'-':money(c.contado)}</td><td class="${+c.diferencia?'warn':''}">${c.diferencia==null?'-':money(c.diferencia)}</td></tr>`).join('')}</table></div>`}
async function productos(){const [ps,cs]=await Promise.all([api('admin/productos'),api('admin/categorias')]);
 $('#main').innerHTML=H('Menú y recetas','Productos, precios, disponibilidad y composición de insumos','<button class="btn sec" id="nc">Nueva categoría</button><button class="btn" id="np">Nuevo producto</button>')+`<div class="tw"><table><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${esc(p.categoria)}</td><td>${money(p.precio)}</td><td><span class="badge ${p.activo==1?'ok':'ko'}">${p.activo==1?'Activo':'Inactivo'}</span></td><td class="row end"><button class="btn sm sec" data-e="${p.id}">Editar</button><button class="btn sm sec" data-r="${p.id}">Receta</button></td></tr>`).join('')}</table></div>`;
 const f=[{k:'nombre',l:'Nombre'},{k:'categoria_id',l:'Categoría',t:'select',o:cs.map(c=>[c.id,c.nombre])},{k:'precio',l:'Precio',t:'number'},{k:'activo',l:'Estado',t:'select',o:[[1,'Activo'],[0,'Inactivo (oculto en caja)']]}];
 $('#np').onclick=()=>formDlg('Nuevo producto',f,{activo:1},async o=>{await api('admin/productos',o);productos()});
 $('#nc').onclick=()=>formDlg('Nueva categoría',[{k:'nombre',l:'Nombre'}],{},async o=>{await api('admin/categorias',o);productos()});
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const p=ps.find(x=>x.id==b.dataset.e);formDlg('Editar producto',f,p,async o=>{await api('admin/productos',{...o,id:p.id});productos()})});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const id=b.dataset.r,[ins,rec]=await Promise.all([api('admin/insumos'),api('admin/receta/'+id)]),v={};rec.forEach(r=>v['i'+r.insumo_id]=+r.cantidad);
  formDlg('Receta: cantidad por porción (0 = no usa)',ins.map(i=>({k:'i'+i.id,l:`${i.nombre} (${i.unidad})`,t:'number'})),v,async o=>{await api('admin/receta/'+id,{items:ins.map(i=>({insumo_id:i.id,cantidad:+o['i'+i.id]||0})).filter(x=>x.cantidad>0)});toast('Receta guardada')})})}
async function insumos(){const is=await api('admin/insumos');
 $('#main').innerHTML=H('Inventario','Existencias de insumos y registro de compras','<button class="btn" id="ni">Nuevo insumo</button>')+`<div class="tw"><table><tr><th>Insumo</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th></th></tr>${is.map(i=>`<tr><td>${esc(i.nombre)}</td><td>${+i.stock} ${esc(i.unidad)}</td><td>${+i.stock_minimo}</td><td><span class="badge ${+i.stock<=+i.stock_minimo?'ko':'ok'}">${+i.stock<=+i.stock_minimo?'Reponer':'Normal'}</span></td><td class="row end"><button class="btn sm" data-n="${i.id}">Registrar entrada</button><button class="btn sm sec" data-i="${i.id}">Editar</button></td></tr>`).join('')}</table></div>`;
 const f=[{k:'nombre',l:'Nombre'},{k:'unidad',l:'Unidad (g, ml, und)'},{k:'stock',l:'Stock actual',t:'number'},{k:'stock_minimo',l:'Stock mínimo',t:'number'}];
 $('#ni').onclick=()=>formDlg('Nuevo insumo',f,{stock:0,stock_minimo:0},async o=>{await api('admin/insumos',o);insumos()});
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=is.find(x=>x.id==b.dataset.i);formDlg('Editar insumo',f,i,async o=>{await api('admin/insumos',{...o,id:i.id});insumos()})});
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const i=is.find(x=>x.id==b.dataset.n);formDlg('Entrada de '+i.nombre+' ('+i.unidad+')',[{k:'cantidad',l:'Cantidad recibida',t:'number'}],{},async o=>{await api(`admin/insumos/${i.id}/entrada`,{cantidad:+o.cantidad});insumos()},'Registrar')})}
async function usuarios(){const us=await api('admin/usuarios');
 $('#main').innerHTML=H('Usuarios y roles','Credenciales y permisos de acceso','<button class="btn" id="nu">Nuevo usuario</button>')+`<div class="tw"><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>${us.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${esc(x.email)}</td><td>${x.rol}</td><td><span class="badge ${x.activo==1?'ok':'ko'}">${x.activo==1?'Activo':'Inactivo'}</span></td><td class="row end"><button class="btn sm sec" data-u="${x.id}">Editar</button></td></tr>`).join('')}</table></div>`;
 const f=[{k:'nombre',l:'Nombre'},{k:'email',l:'Correo',t:'email'},{k:'rol',l:'Rol',t:'select',o:[['cajero','Cajero'],['cocinero','Cocinero'],['administrador','Administrador']]},{k:'activo',l:'Estado',t:'select',o:[[1,'Activo'],[0,'Inactivo']]},{k:'password',l:'Contraseña (vacío = no cambiar)',t:'password'}];
 $('#nu').onclick=()=>formDlg('Nuevo usuario',f,{activo:1},async o=>{await api('admin/usuarios',o);usuarios()});
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const x=us.find(y=>y.id==b.dataset.u);formDlg('Editar usuario',f,x,async o=>{await api('admin/usuarios',{...o,id:x.id});usuarios()})})}
const tabs={reportes,historial,cajas,productos,insumos,usuarios};
async function show(t){document.querySelectorAll('.side [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));try{await tabs[t]()}catch(e){toast(e.message)}}
document.querySelectorAll('.side [data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));show('reportes');
</script></body></html>
